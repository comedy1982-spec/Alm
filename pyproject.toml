[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ecualm"
version = "0.1.0"
description = "ASPICE PAM 4.0 requirements management (DOCX/PDF import, stable IDs, traceability audit)"
requires-python = ">=3.9"
dependencies = ["python-docx>=1.1", "pdfplumber>=0.11", "pymupdf>=1.24", "openpyxl>=3.1", "pillow>=10"]

[project.scripts]
ecualm = "ecualm.cli:main"

[tool.setuptools]
packages = ["ecualm"]

[tool.setuptools.package-data]
ecualm = ["web/*", "data/*.json"]
